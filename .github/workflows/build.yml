name: Build Nadodi APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Verify Flutter & Environment
        run: |
          flutter doctor -v
          echo "Flutter version: $(flutter --version)"
          echo "Java version: $(java -version 2>&1 | head -1)"
          echo "Gradle version: $(gradle -v 2>&1 | head -1)"

      - name: Get dependencies
        run: flutter pub get
        env:
          PUB_CACHE: ${{ github.workspace }}/.pub-cache

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test --no-pub
        continue-on-error: true

      - name: Clean build
        run: flutter clean

      - name: Build Release APK (split per ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --verbose

      - name: Verify APKs exist
        run: |
          echo "=== Build outputs ==="
          ls -la build/app/outputs/flutter-apk/
          echo "=== APK sizes ==="
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [[ -f "$f" ]] && echo "$(basename "$f"): $(du -h "$f" | cut -f1)"
          done

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          timestamp=$(date +%Y%m%d-%H%M%S)
          commit_short=$(git rev-parse --short HEAD)
          
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [[ -f "$f" ]] || continue
            abi=$(basename "$f" .apk | sed 's/app-//' | sed 's/-release//')
            cp "$f" "artifacts/nadodi-v2.1.0-${commit_short}-${timestamp}-${abi}.apk"
          done
          
          # Universal APK
          if [[ -f build/app/outputs/flutter-apk/app-release.apk ]]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
              "artifacts/nadodi-v2.1.0-${commit_short}-${timestamp}-universal.apk"
          fi
          
          echo "=== Artifacts created ==="
          ls -la artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nadodi-apk-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          compression-level: 6

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-build${{ github.run_number }}
          name: "Nadodi v2.1.0 Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true