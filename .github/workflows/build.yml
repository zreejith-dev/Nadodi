name: Build Nadodi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Clean build
        run: flutter clean

      - name: Build Debug APK
        run: flutter build apk --debug --split-per-abi --verbose

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          for f in build/app/outputs/flutter-apk/app-*-debug.apk; do
            abi=$(basename "$f" .apk | sed 's/app-//' | sed 's/-debug//')
            cp "$f" "artifacts/nadodi-new-apk-${abi}.apk"
          done
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk artifacts/nadodi-new-apk-universal.apk
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nadodi-new-apk
          path: artifacts/
          retention-days: 7

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-${{ github.run_number }}
          name: Nadodi v2.1.0 Build ${{ github.run_number }}
          files: artifacts/*.apk
          generate_release_notes: true