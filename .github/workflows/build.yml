name: Build Nadodi APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --split-per-abi --verbose

      - name: Verify APKs exist
        run: |
          echo "=== Build outputs ==="
          ls -la build/app/outputs/flutter-apk/
          echo ""
          echo "=== APK sizes ==="
          for f in build/app/outputs/flutter-apk/app-*.apk; do
            if [ -f "$f" ]; then
              echo "$(basename "$f"): $(du -h "$f" | cut -f1)"
            fi
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nadodi-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30
